name: Lenovo TB-X704L legacy DTS compatibility probe (NO FLASH)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-dts:
    if: github.event.repository.private == false
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: zeelog/android_kernel_xiaomi_mido
          ref: d3baaff6d797893e6caea354b74ddf277ca62605
          path: kernel-source
          fetch-depth: 1
      - name: Tools on disposable public runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential bc bison flex libssl-dev libelf-dev clang device-tree-compiler gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi
      - name: Fetch hash-checked upstream Lenovo board files
        run: node scripts/stage-lenovo-dts-probe.mjs kernel-source
      - name: Test legacy bindings against the reference 4.9 tree
        shell: bash
        run: |
          set -euo pipefail
          cd kernel-source
          test "$(git rev-parse HEAD)" = d3baaff6d797893e6caea354b74ddf277ca62605
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- mido_defconfig
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- DTC_FLAGS= V=1 qcom/tbx704-msm8953-qrd.dtb
          echo 'X704_DTB_AUDIT_BEGIN'
          node ../scripts/audit-lenovo-dtb.mjs out/arch/arm64/boot/dts/qcom/tbx704-msm8953-qrd.dtb
          echo 'X704_DTB_AUDIT_END'
          echo 'DTS syntax/dependency probe only. No validated Lenovo kernel or ROM was produced.'
      # No artifacts, caches, private credentials, ROM builds or device access.
